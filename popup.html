<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedster - Video Speed Controller</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <h2>Speedster</h2>
        <div class="speed-info">
            <p>Current Speed:</p>
            <div id="speedDisplay">1.0x</div>
        </div>
        <div class="keybindings">
            <h3>Key Shortcuts</h3>
            <ul>
                <li><strong>D</strong> - Increase Speed</li>
                <li><strong>S</strong> - Decrease Speed</li>
                <li><strong>R</strong> - Reset Speed</li>
            </ul>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
